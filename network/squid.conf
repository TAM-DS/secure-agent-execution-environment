#squid.conf - egress allowlist for the agent sandbox
#define the destination we allow - Anthropic's API only
acl allowed_dst dstdomain api.anthropic.com
http_port 3128

#standard squid setup: listen on port 3128 (default proxy port)
# allow CONNECT (https tunneling) only to our allowed destination, on port 443
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT allowed_dst SSL_ports
http_access deny CONNECT !allowed_dst

#DEny everything else, explicitly, as the last rule
http_access deny all
